name: Build JAR

# Manual trigger only: go to the Actions tab on GitHub, pick this workflow,
# and click "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: AxPlayerWarps-${{ github.sha }}
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
          retention-days: 3
